services:
  backend:
    build: ./backend
    container_name: thesis-backend
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://3.6.95.116:5000/api
    container_name: thesis-frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend